services:
  traefik:
    image: traefik:v2.11
    container_name: 'prompt-edit-traefik'
    ports:
      - '80:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    networks:
      - prompt-edit

  postgres:
    container_name: 'prompt-edit-postgres'
    image: 'postgres:17-alpine'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-prompt_edit}'
      POSTGRES_USER: '${DB_USERNAME:-prompt_edit}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'prompt-edit-postgres:/var/lib/postgresql/data'
    networks:
      - prompt-edit
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-prompt_edit}", "-U", "${DB_USERNAME:-prompt_edit}"]
      retries: 3
      timeout: 5s

  redis:
    container_name: 'prompt-edit-redis'
    image: 'redis:alpine'
    ports:
      - '6379:6379'
    volumes:
      - 'prompt-edit-redis:/data'
    networks:
      - prompt-edit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  app:
    container_name: 'prompt-edit-app'
    image: prompt-edit-app
    entrypoint: ['/app/entrypoint.sh']
    command: ["web"]
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: development
      args:
        WWWGROUP: '${WWWGROUP}'
        WWWUSER: '${WWWUSER}'
    depends_on:
      - traefik
      - postgres
      - test-postgres
      - redis
      - test-redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:8080'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`prompt-edit.localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=8080
    environment:
      WWWUSER: '${WWWUSER}'
      COMPOSER_HOME: '/tmp/.composer'
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
      ENABLE_NPM_FRONTEND: '${ENABLE_NPM_FRONTEND:-true}'
    volumes:
      - '.:/var/www'
    networks:
      - prompt-edit

  worker:
    container_name: 'prompt-edit-worker'
    image: prompt-edit-app
    entrypoint: ['/app/entrypoint.sh']
    command: ["worker"]
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: development
      args:
        WWWGROUP: '${WWWGROUP}'
        WWWUSER: '${WWWUSER}'
    depends_on:
      - app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER}'
      COMPOSER_HOME: '/tmp/.composer'
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
    volumes:
      - '.:/var/www'
    networks:
      - prompt-edit

  test-postgres:
    container_name: 'prompt-edit-test-postgres'
    image: 'postgres:17-alpine'
    tmpfs: /var/lib/postgresql/data
    ports:
      - '${FORWARD_TEST_DB_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: 'prompt_edit_test'
      POSTGRES_USER: 'prompt_edit'
      POSTGRES_PASSWORD: 'secret'
    networks:
      - prompt-edit
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "prompt_edit_test", "-U", "prompt_edit"]
      retries: 3
      timeout: 5s

  test-redis:
    container_name: 'prompt-edit-test-redis'
    image: 'redis:alpine'
    ports:
      - '6381:6379'
    networks:
      - prompt-edit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  playwright:
    container_name: 'prompt-edit-playwright'
    image: 'mcr.microsoft.com/playwright:v1.65.1-noble'
    profiles: ['e2e']
    network_mode: 'service:app'
    ipc: host
    init: true
    working_dir: '/var/www'
    environment:
      E2E_BASE_URL: 'http://127.0.0.1:8080'
      CI: '${CI:-}'
    volumes:
      - '.:/var/www'
    depends_on:
      - app

networks:
  prompt-edit:
    name: prompt-edit
    driver: bridge

volumes:
  prompt-edit-postgres:
    driver: local
  prompt-edit-redis:
    driver: local

