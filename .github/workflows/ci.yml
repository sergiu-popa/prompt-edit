name: CI
on: push
env:
  DOCKER_REGISTRY: ghcr.io/sergiu-popa/
  IMAGE_NAME: prompt-edit-ci-image
  PHPSTAN_CACHE_BRANCH: main
  PHPSTAN_CACHE_TMPDIR: /tmp/phpstan
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      DOCKER_BRANCH_IMAGE: ${{ steps.expose-env-variables.outputs.DOCKER_BRANCH_IMAGE }}
    steps:
      - name: Set env variables
        id: env-variables
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          GROOMED_BRANCH_NAME="${BRANCH_NAME//\//-}"
          DOCKER_MAIN_IMAGE=${{ env.DOCKER_REGISTRY }}${{ env.IMAGE_NAME }}:latest
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; \
            then DOCKER_BRANCH_IMAGE=$DOCKER_MAIN_IMAGE; \
            else DOCKER_BRANCH_IMAGE=${{ env.DOCKER_REGISTRY }}${{ env.IMAGE_NAME }}:$GROOMED_BRANCH_NAME-latest; fi
          echo "DOCKER_MAIN_IMAGE=$DOCKER_MAIN_IMAGE" >> $GITHUB_ENV
          echo "DOCKER_BRANCH_IMAGE=$DOCKER_BRANCH_IMAGE" >> $GITHUB_ENV
          echo "DOCKER_CACHE_IMAGE=$DOCKER_BRANCH_IMAGE" >> $GITHUB_ENV
      - name: Checkout project
        uses: actions/checkout@v6
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker pull branch latest
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          docker pull ${{ env.DOCKER_BRANCH_IMAGE }}
      - name: Docker pull main latest
        id: docker-pull-latest
        if: steps.env-variables.outcome == 'success'
        continue-on-error: true
        run: |
          docker pull ${{ env.DOCKER_MAIN_IMAGE }}
          echo "DOCKER_CACHE_IMAGE=${{ env.DOCKER_MAIN_IMAGE }}" >> $GITHUB_ENV
      - name: Docker build
        run: |
          docker build --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg WWWUSER=$(id -u) \
            --build-arg WWWGROUP=$(id -g) \
            -f .docker/Dockerfile \
            --target ci \
            -t ${{ env.DOCKER_BRANCH_IMAGE }} \
            --cache-from ${{ env.DOCKER_CACHE_IMAGE }} \
            .
        env:
          DOCKER_BUILDKIT: 1
      - name: Save docker image tar
        run: |
          docker save -o /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar ${{ env.DOCKER_BRANCH_IMAGE }}
      - name: Cache docker image
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
          key: ${{ env.IMAGE_NAME }}-${{ github.run_id }}
      - name: Expose env variables between jobs
        id: expose-env-variables
        run: |
          echo "DOCKER_BRANCH_IMAGE=${{ env.DOCKER_BRANCH_IMAGE }}" >> $GITHUB_OUTPUT

  lint:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run lint
        run: composer lint

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check
        run: npm run types
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build

  stan:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: [docker-build, lint]
    timeout-minutes: 15
    steps:
      - name: Consume env variables
        run: |
          echo "DOCKER_BRANCH_IMAGE=${{ needs.docker-build.outputs.DOCKER_BRANCH_IMAGE }}" >> $GITHUB_ENV
      - name: Fetch docker image
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
          key: ${{ env.IMAGE_NAME }}-${{ github.run_id }}
      - name: Load docker image
        run: |
          docker load -i /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
      - name: Restore PHPStan cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PHPSTAN_CACHE_TMPDIR }}/resultCache.php
          key: phpstan-cache-${{ env.PHPSTAN_CACHE_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            phpstan-cache-${{ env.PHPSTAN_CACHE_BRANCH }}
      - name: Run static analysis
        run: |
          mkdir -p ${{ env.PHPSTAN_CACHE_TMPDIR }}
          docker run \
            -v ${{ env.PHPSTAN_CACHE_TMPDIR }}:${{ env.PHPSTAN_CACHE_TMPDIR }} \
            --entrypoint composer ${{ env.DOCKER_BRANCH_IMAGE }} \
            stan
      - if: ${{ github.ref_name == env.PHPSTAN_CACHE_BRANCH }}
        name: Save PHPStan cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PHPSTAN_CACHE_TMPDIR }}/resultCache.php
          key: phpstan-cache-${{ env.PHPSTAN_CACHE_BRANCH }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [docker-build, lint]
    timeout-minutes: 25
    env:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_DATABASE: prompt_edit_test
      DB_USERNAME: prompt_edit
      DB_PASSWORD: secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prompt_edit_test
          POSTGRES_USER: prompt_edit
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U prompt_edit" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Consume env variables
        run: |
          echo "DOCKER_BRANCH_IMAGE=${{ needs.docker-build.outputs.DOCKER_BRANCH_IMAGE }}" >> $GITHUB_ENV
      - name: Fetch docker image
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
          key: ${{ env.IMAGE_NAME }}-${{ github.run_id }}
      - name: Load docker image
        run: |
          docker load -i /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
      - name: Resolve services network
        run: |
          SERVICE_NETWORK=$(docker inspect ${{ job.services.postgres.id }} --format '{{ range $k, $v := .NetworkSettings.Networks }}{{ println $k }}{{ end }}' | sed -n '1p')
          echo "JOB_DOCKER_NETWORK=$SERVICE_NETWORK" >> $GITHUB_ENV
      - name: Migrate the database
        run: |
          docker run \
            -e REDIS_HOST \
            -e DB_CONNECTION \
            -e DB_HOST \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            --network $JOB_DOCKER_NETWORK \
            --entrypoint php \
            ${{ env.DOCKER_BRANCH_IMAGE }} \
            artisan migrate
      - name: Run tests with coverage
        run: |
          docker run \
            -e REDIS_HOST \
            -e DB_CONNECTION \
            -e DB_HOST \
            -e DB_DATABASE \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            --network $JOB_DOCKER_NETWORK \
            --entrypoint php \
            ${{ env.DOCKER_BRANCH_IMAGE }} \
            artisan test --coverage --min=80

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [docker-build, lint]
    timeout-minutes: 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_DATABASE: prompt_edit_e2e
      DB_USERNAME: prompt_edit
      DB_PASSWORD: secret
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prompt_edit_e2e
          POSTGRES_USER: prompt_edit
          POSTGRES_PASSWORD: secret
        options: --health-cmd="pg_isready -U prompt_edit" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Consume env variables
        run: |
          echo "DOCKER_BRANCH_IMAGE=${{ needs.docker-build.outputs.DOCKER_BRANCH_IMAGE }}" >> $GITHUB_ENV
      - name: Fetch docker image
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
          key: ${{ env.IMAGE_NAME }}-${{ github.run_id }}
      - name: Load docker image
        run: |
          docker load -i /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
      - name: Resolve services network
        run: |
          SERVICE_NETWORK=$(docker inspect ${{ job.services.postgres.id }} --format '{{ range $k, $v := .NetworkSettings.Networks }}{{ println $k }}{{ end }}' | sed -n '1p')
          echo "JOB_DOCKER_NETWORK=$SERVICE_NETWORK" >> $GITHUB_ENV
      - name: Migrate the database
        run: |
          docker run --rm \
            -e REDIS_HOST -e DB_CONNECTION -e DB_HOST -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD \
            --network $JOB_DOCKER_NETWORK \
            --entrypoint php \
            ${{ env.DOCKER_BRANCH_IMAGE }} \
            artisan migrate --force
      - name: Seed the database
        run: |
          docker run --rm \
            -e REDIS_HOST -e DB_CONNECTION -e DB_HOST -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD \
            --network $JOB_DOCKER_NETWORK \
            --entrypoint php \
            ${{ env.DOCKER_BRANCH_IMAGE }} \
            artisan db:seed --force
      - name: Start the app, queue worker and scheduler
        run: |
          docker run -d --name app \
            -e LOG_CHANNEL=stderr \
            -e REDIS_HOST -e DB_CONNECTION -e DB_HOST -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD \
            --network $JOB_DOCKER_NETWORK \
            ${{ env.DOCKER_BRANCH_IMAGE }}
          for mode in worker scheduler; do
            docker run -d --name $mode \
              -e LOG_CHANNEL=stderr \
              -e REDIS_HOST -e DB_CONNECTION -e DB_HOST -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD \
              --network $JOB_DOCKER_NETWORK \
              ${{ env.DOCKER_BRANCH_IMAGE }} $mode
          done
          for attempt in $(seq 1 30); do
            docker exec app php -r 'exit(@file_get_contents("http://127.0.0.1:8080/up") === false ? 1 : 0);' && exit 0
            sleep 2
          done
          docker logs app
          exit 1
      - name: Run Playwright
        run: |
          docker run --rm \
            --network container:app \
            --ipc=host \
            -e CI=true \
            -e E2E_BASE_URL=http://127.0.0.1:8080 \
            -v "$PWD":/work -w /work \
            $PLAYWRIGHT_IMAGE \
            bash -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: App, worker and scheduler logs
        if: failure()
        run: |
          for c in app worker scheduler; do echo "::group::$c"; docker logs $c; echo "::endgroup::"; done

  docker-push:
    name: Docker push
    runs-on: ubuntu-latest
    needs: [docker-build, test, lint, stan, frontend, e2e]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Consume env variables
        run: |
          echo "DOCKER_BRANCH_IMAGE=${{ needs.docker-build.outputs.DOCKER_BRANCH_IMAGE }}" >> $GITHUB_ENV
      - name: Fetch docker image
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
          key: ${{ env.IMAGE_NAME }}-${{ github.run_id }}
      - name: Load docker image
        run: |
          docker load -i /tmp/${{ env.IMAGE_NAME }}-${{ github.run_id }}.tar
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push docker image
        run: |
          docker push ${{ env.DOCKER_BRANCH_IMAGE }}

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Delete cache
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: '${{ env.IMAGE_NAME }}-${{ github.run_id }}',
            })
